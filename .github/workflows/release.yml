name: release

# 모든 에이전트의 플러그인을 release/<agent> 브랜치에 올리고, v<version> 태그 하나와 GitHub Release 하나를 만든다.
# 버전은 plugin.config.json 의 version 이다.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 올리지 않고 무엇이 나갈지만 본다
        type: boolean
        default: false

# 잡마다 필요한 권한만 따로 준다.
permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # 테스트는 저장소의 코드를 실행한다. 쓰기 권한이 없는 잡에서 돌린다.
  test:
    # 호스티드 러너가 막힌 동안(리포 변수 HOSTED_RUNNERS=off)은 셀프 호스트 검사 풀에서 돈다. tting, tting-cloud 와 같은 스위치다.
    runs-on: ${{ vars.HOSTED_RUNNERS != 'off' && 'ubuntu-24.04-arm' || fromJSON('["self-hosted","vms-arm64-check"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: main 에서만 릴리스한다
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::릴리스는 main 에서만 낸다 (받은 ref: ${GITHUB_REF})"
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: 테스트
        run: npm test

  release:
    needs: test
    runs-on: ${{ vars.HOSTED_RUNNERS == 'off' && fromJSON('["self-hosted","vms-arm64-deploy"]') || 'ubuntu-24.04-arm' }}
    timeout-minutes: 10
    # 이 환경은 main 에서만 쓸 수 있게 저장소 설정에서 묶어 둔다. 승인자를 두려면 환경에 더한다.
    environment: release
    permissions:
      contents: write
    env:
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: 릴리스 커밋의 작성자
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: 릴리스 브랜치와 태그
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/release.mjs
          else
            node scripts/release.mjs --push
          fi
      # 태그는 올라갔는데 이 단계가 실패했으면 같은 실행을 다시 돌린다. 앞 단계는 건너뛰고 여기만 다시 한다.
      - name: GitHub Release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(jq -r '.tag' dist/release.json)
          # 404 만 "없다"로 본다. 다른 실패는 사유를 찍고 멈춘다.
          if found=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.html_url' 2>&1); then
            echo "[release] ${tag}: GitHub Release 가 이미 있다 (${found})"
            exit 0
          elif ! grep -q 'HTTP 404' <<<"$found"; then
            echo "::error::${tag}: GitHub Release 를 확인하지 못했다: ${found}"
            exit 1
          fi
          gh release create "$tag" dist/assets/* \
            --verify-tag \
            --latest \
            --title "$tag" \
            --notes-file dist/release-notes.md
          echo "[release] ${tag}: GitHub Release 를 만들었다"
      - name: 산출물 보관
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/
          include-hidden-files: true
          # 같은 실행을 다시 돌려도 이름이 겹쳐 실패하지 않게 한다.
          overwrite: true
