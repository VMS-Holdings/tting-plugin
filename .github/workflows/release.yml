name: release

# 에이전트 하나(또는 전부)의 플러그인을 release/<agent> 브랜치에 올리고 <agent>-v<version> 태그와
# GitHub Release 를 만든다. 버전은 plugin.config.json 의 agents.<agent>.version 이다.
on:
  workflow_dispatch:
    inputs:
      agent:
        description: 릴리스할 에이전트
        type: choice
        required: true
        options: [claude, gemini, codex, grok, all]
      dry_run:
        description: 올리지 않고 무엇이 나갈지만 본다
        type: boolean
        default: false

# 잡마다 필요한 권한만 따로 준다.
permissions: {}

# 같은 에이전트의 릴리스는 한 번에 하나만 돈다. 묶음을 에이전트별로 나눈 것은, 한 묶음에서는
# 기다리는 실행이 하나뿐이라 연달아 실행하면 앞서 기다리던 것이 취소되기 때문이다.
concurrency:
  group: release-${{ inputs.agent }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  # 테스트는 저장소의 코드를 실행한다. 쓰기 권한이 없는 잡에서 돌린다.
  test:
    # 조직의 호스티드 러너가 막혀 있는 동안(리포 변수 `HOSTED_RUNNERS=off`)은 셀프 호스트 검사 풀에서 돈다.
    # 형제 리포(tting, tting-cloud)와 같은 스위치다. 풀과 라벨은 infrastructure 의 github_runner README 에 있다.
    runs-on: ${{ vars.HOSTED_RUNNERS != 'off' && 'ubuntu-24.04-arm' || fromJSON('["self-hosted","vms-arm64-check"]') }}
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: main 에서만 릴리스한다
        if: github.ref != 'refs/heads/main'
        run: |
          echo "::error::릴리스는 main 에서만 낸다 (받은 ref: ${GITHUB_REF})"
          exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: 테스트
        run: npm test

  release:
    needs: test
    # 릴리스는 배포 풀에서 돈다. 같은 에이전트가 두 자리에서 겹쳐 돌지 않는 것은 위의 concurrency 가 맡는다.
    runs-on: ${{ vars.HOSTED_RUNNERS == 'off' && fromJSON('["self-hosted","vms-arm64-deploy"]') || 'ubuntu-24.04-arm' }}
    timeout-minutes: 10
    # 이 환경은 main 에서만 쓸 수 있게 저장소 설정에서 묶어 둔다. 승인자를 두려면 환경에 더한다.
    environment: release
    permissions:
      contents: write
    env:
      AGENT: ${{ inputs.agent }}
      DRY_RUN: ${{ inputs.dry_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: 릴리스 커밋의 작성자
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: 릴리스 브랜치와 태그
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            node scripts/release.mjs --agent "$AGENT"
          else
            node scripts/release.mjs --agent "$AGENT" --push
          fi
      # 앞 단계가 도중에 실패해도 돈다. 이미 올라간 태그에 GitHub Release 가 빠지지 않게 하려는 것이다.
      # 태그는 있는데 GitHub Release 가 없으면 `all` 로 다시 실행한다. 빠진 것만 채운다.
      - name: GitHub Release
        if: ${{ !cancelled() && !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 목록을 먼저 변수로 받는다. 파일이 없거나 깨졌으면 여기서 실패한다.
          releases=$(jq -c '.[] | select(.pushed or .skipped)' dist/releases.json)
          if [ -z "$releases" ]; then
            echo "[release] 만들 GitHub Release 가 없다"
            exit 0
          fi
          while read -r release; do
            agent=$(jq -r '.agent' <<<"$release")
            version=$(jq -r '.version' <<<"$release")
            tag=$(jq -r '.tag' <<<"$release")
            branch=$(jq -r '.branch' <<<"$release")
            # 404 만 "없다"로 본다. 다른 실패는 사유를 찍고 멈춘다.
            if found=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${tag}" --jq '.html_url' 2>&1 </dev/null); then
              echo "[release] ${tag}: GitHub Release 가 이미 있다 (${found})"
              continue
            elif ! grep -q 'HTTP 404' <<<"$found"; then
              echo "::error::${tag}: GitHub Release 를 확인하지 못했다: ${found}"
              exit 1
            fi
            name="tting-plugin-${agent}-${version}"
            git fetch --quiet --no-tags origin "refs/tags/${tag}:refs/tags/${tag}"
            git archive --format=tar.gz --prefix="${name}/" --output="${name}.tar.gz" "$tag"
            gh release create "$tag" "${name}.tar.gz" \
              --verify-tag \
              --title "${agent} v${version}" \
              --notes "Install instructions: README on the \`${branch}\` branch." </dev/null
            echo "[release] ${tag}: GitHub Release 를 만들었다"
          done <<<"$releases"
      - name: 산출물 보관
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist-${{ inputs.agent }}
          path: dist/
          include-hidden-files: true
          # 같은 실행을 다시 돌려도 이름이 겹쳐 실패하지 않게 한다.
          overwrite: true
